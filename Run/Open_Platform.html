<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://localhost:8080/">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
            padding-top: 80px;
            color: #1e293b;
        }
        .card {
            background: white;

            padding: 30px;

            text-decoration: none;
            font-size: 1.1rem;

    <div class="card">
        <h2>🎓 EduPulse Platform Launcher</h2>

</html>
